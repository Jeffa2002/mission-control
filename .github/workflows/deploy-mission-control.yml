name: Deploy Mission Control

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'apps/panel/**'
      - 'apps/docker-compose.yml'
      - 'scripts/deploy-prod.sh'
      - '.github/workflows/deploy-mission-control.yml'

concurrency:
  group: mission-control-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy panel
    runs-on:
      - self-hosted
      - mission-control-prod

    steps:
      - name: Prepare repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_dir=/tmp/mission-control-deploy-src
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/Jeffa2002/mission-control.git"
          if [ ! -d "$repo_dir/.git" ]; then
            rm -rf "$repo_dir"
            git clone "$repo_url" "$repo_dir"
          fi
          cd "$repo_dir"
          git fetch "$repo_url" master
          git reset --hard FETCH_HEAD
          git clean -fd

      - name: Sync source into production tree
        working-directory: /tmp/mission-control-deploy-src
        run: |
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude .next \
            --exclude .env \
            --exclude '*.env' \
            --exclude tsconfig.tsbuildinfo \
            --exclude runtime \
            --exclude agent-status.json \
            --exclude iperf-results.json \
            --exclude network-history.db \
            --exclude network-history.db-journal \
            --exclude security-data.json \
            ./ /var/www/mission-control/

      - name: Rebuild and restart prod
        working-directory: /var/www/mission-control/apps
        run: docker-compose build panel && docker-compose up -d panel

      - name: Verify prod
        run: |
          set -euo pipefail
          set -a
          . /etc/infisical/generated/mission-control.runtime.env
          set +a
          for attempt in $(seq 1 20); do
            if dashboard_html="$(curl -fsS -H "Cookie: mc_auth=$MISSION_COOKIE_SECRET" http://127.0.0.1:3020/)" \
              && security_html="$(curl -fsS -H "Cookie: mc_auth=$MISSION_COOKIE_SECRET" http://127.0.0.1:3020/security)" \
              && office_html="$(curl -fsS -H "Cookie: mc_auth=$MISSION_COOKIE_SECRET" http://127.0.0.1:3020/office)" \
              && teams_html="$(curl -fsS -H "Cookie: mc_auth=$MISSION_COOKIE_SECRET" http://127.0.0.1:3020/teams)" \
              && printf "%s" "$dashboard_html" | grep -qi "operational brief" \
              && printf "%s" "$dashboard_html" | grep -q "Needs action" \
              && printf "%s" "$security_html" | grep -q "Security Threat Surface" \
              && printf "%s" "$office_html" | grep -qi "active roster" \
              && printf "%s" "$teams_html" | grep -q "Team Directory" \
              && curl -fsS -H "Cookie: mc_auth=$MISSION_COOKIE_SECRET" http://127.0.0.1:3020/activity >/dev/null; then
              exit 0
            fi
            echo "Waiting for panel restart ($attempt/20)..."
            sleep 3
          done
          exit 1
