name: Deploy Mission Control

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'apps/panel/**'
      - 'apps/docker-compose.yml'
      - 'scripts/deploy-prod.sh'
      - '.github/workflows/deploy-mission-control.yml'

concurrency:
  group: mission-control-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy panel
    runs-on:
      - self-hosted
      - mission-control-prod

    steps:
      - name: Prepare repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_dir=/tmp/mission-control-deploy-src
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/Jeffa2002/mission-control.git"
          if [ ! -d "$repo_dir/.git" ]; then
            rm -rf "$repo_dir"
            git clone "$repo_url" "$repo_dir"
          fi
          cd "$repo_dir"
          git fetch "$repo_url" master
          git reset --hard FETCH_HEAD
          git clean -fd

      - name: Validate panel
        working-directory: /tmp/mission-control-deploy-src/apps/panel
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Sync source into production tree
        working-directory: /tmp/mission-control-deploy-src
        run: |
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude .next \
            --exclude .env \
            --exclude '*.env' \
            --exclude tsconfig.tsbuildinfo \
            --exclude runtime \
            --exclude agent-status.json \
            --exclude iperf-results.json \
            --exclude network-history.db \
            --exclude network-history.db-journal \
            --exclude security-data.json \
            ./ /var/www/mission-control/

      - name: Rebuild and restart prod
        working-directory: /var/www/mission-control/apps
        run: |
          set -euo pipefail
          install -d -m 0700 -o 100 -g 101 /var/www/mission-control/runtime/auth
          exec 9>/var/lock/per-web-deploy.lock
          flock -w 1800 9
          if current_image="$(docker image inspect --format '{{.Id}}' apps-panel:latest 2>/dev/null)"; then
            docker image tag "$current_image" apps-panel:rollback
          fi
          docker-compose build panel
          docker-compose up -d panel

      - name: Verify prod
        run: |
          set -euo pipefail
          set -a
          . /etc/infisical/generated/mission-control.runtime.env
          set +a
          for attempt in $(seq 1 20); do
            if /var/www/mission-control/scripts/smoke-test-panel.sh http://127.0.0.1:3020; then
              exit 0
            fi
            echo "Waiting for panel restart ($attempt/20)..."
            sleep 3
          done
          exit 1

      - name: Roll back failed release
        if: failure()
        working-directory: /var/www/mission-control/apps
        run: |
          set -euo pipefail
          if ! docker image inspect apps-panel:rollback >/dev/null 2>&1; then
            echo "No rollback image is available" >&2
            exit 1
          fi
          docker image tag apps-panel:rollback apps-panel:latest
          docker-compose up -d --no-deps --force-recreate panel
          set -a
          . /etc/infisical/generated/mission-control.runtime.env
          set +a
          for attempt in $(seq 1 20); do
            if /var/www/mission-control/scripts/smoke-test-panel.sh http://127.0.0.1:3020; then
              echo "Previous panel image restored and verified"
              exit 0
            fi
            sleep 3
          done
          echo "Rollback image did not become healthy" >&2
          exit 1

      - name: Prune stale Docker artifacts
        if: success()
        run: |
          set -euo pipefail
          docker container prune --force --filter 'until=168h'
          docker image prune --force
          docker builder prune --all --force --keep-storage 4GB
          docker system df
