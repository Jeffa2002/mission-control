name: Deploy Mission Control

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'apps/panel/**'
      - 'apps/docker-compose.yml'
      - 'scripts/deploy-prod.sh'
      - '.github/workflows/deploy-mission-control.yml'

concurrency:
  group: mission-control-prod
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build and deploy panel
    runs-on:
      - self-hosted
      - mission-control-prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json

      - name: Install dependencies
        working-directory: apps/panel
        run: npm ci --legacy-peer-deps

      - name: Build panel
        working-directory: apps/panel
        run: npm run build

      - name: Sync source into production tree
        run: |
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude .next \
            --exclude .env \
            --exclude '*.env' \
            --exclude tsconfig.tsbuildinfo \
            --exclude runtime \
            --exclude agent-status.json \
            --exclude iperf-results.json \
            --exclude network-history.db \
            --exclude network-history.db-journal \
            --exclude security-data.json \
            ./ /var/www/mission-control/

      - name: Rebuild and restart prod
        working-directory: /var/www/mission-control/apps
        run: docker-compose build panel && docker-compose up -d panel

      - name: Verify prod
        run: |
          set -euo pipefail
          set -a
          . /etc/infisical/generated/mission-control.runtime.env
          set +a
          for attempt in $(seq 1 20); do
            if html="$(curl -fsS -H "Cookie: mc_auth=$MISSION_COOKIE_SECRET" http://127.0.0.1:3020/)" \
              && printf "%s" "$html" | grep -q "Unified Activity" \
              && printf "%s" "$html" | grep -q "Runbook" \
              && curl -fsS -H "Cookie: mc_auth=$MISSION_COOKIE_SECRET" http://127.0.0.1:3020/activity >/dev/null; then
              exit 0
            fi
            echo "Waiting for panel restart ($attempt/20)..."
            sleep 3
          done
          exit 1
