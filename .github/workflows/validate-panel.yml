name: Validate Panel

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/panel/**'
      - 'apps/docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
